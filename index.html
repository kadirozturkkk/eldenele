<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elden Ellere — İkinci El</title>
<meta name="description" content="Kullanmadığım eşyaları uygun fiyata satıyorum. Beğendiğin bir şey olursa WhatsApp'tan yaz.">
<meta property="og:title" content="Elden Ellere — İkinci El">
<meta property="og:description" content="Kullanmadığım eşyaları uygun fiyata satıyorum.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EFE6;--card:#FFFDF8;--ink:#161513;--mute:#6B665C;--line:#E2DBCC;--acc:#1F4D36;--acc2:#E3ECE4;--wa:#1FA855;--warn:#B8741A;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif,.price{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.015em}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.banner{background:#FFF1CF;color:#7A5200;font-size:13px;text-align:center;padding:7px 12px}
header{border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;height:60px}
.logo{font-family:Fraunces,serif;font-weight:700;font-size:21px;display:flex;align-items:center;gap:9px}
.logo span{color:var(--acc);font-style:italic}
.logo svg{flex:none;width:36px;height:36px}
.hnav{margin-right:auto;margin-left:14px;display:flex;gap:2px}
.hnav a{padding:6px 10px;border-radius:8px;font-weight:600;color:var(--mute);font-size:14px}
.hnav a.on{color:var(--ink);background:#E8E1D3}
@media(max-width:560px){.logo b{display:none}.hnav{margin-left:4px}}

.ab{display:grid;grid-template-columns:300px 1fr;gap:40px;padding:40px 0 30px;align-items:start}
@media(max-width:760px){.ab{grid-template-columns:1fr;gap:20px;padding-top:26px}}
.abmark{background:var(--acc);border-radius:24px;aspect-ratio:1;display:grid;place-items:center;position:relative;overflow:hidden}
.abmark svg{width:62%;height:62%}
.abmark small{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#CFE0D3;font-size:12px;letter-spacing:.2em;font-weight:600}
@media(max-width:760px){.abmark{max-width:200px}}
.ab h1{font-size:clamp(32px,5vw,50px);line-height:1.02;margin:0 0 18px}
.ab h1 em{color:var(--acc)}
.abtxt{font-size:16.5px;color:#38342D;white-space:pre-wrap;max-width:640px}
.prom{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:50px}
@media(max-width:700px){.prom{grid-template-columns:1fr}}
.prom div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.prom b{display:block;font-family:Fraunces,serif;font-size:19px;margin:6px 0 4px}
.prom span{color:var(--mute);font-size:14px}
.teaser{display:flex;gap:18px;align-items:center;background:var(--acc);color:#EEF4EF;border-radius:var(--r);padding:22px;margin-bottom:50px}
.teaser svg{width:64px;height:64px;flex:none}
.teaser p{margin:0 0 8px;font-family:Fraunces,serif;font-size:20px;color:#fff;line-height:1.25}
.teaser a{color:#fff;font-weight:700;border-bottom:1px solid rgba(255,255,255,.5)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;cursor:pointer;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--ink);color:#fff}
.btn:active{transform:scale(.98)}
.btn.acc{background:var(--acc)}
.btn.wa{background:var(--wa);font-size:16px;padding:14px 18px;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid #E7C3BF;color:#A42A20}
.btn.sm{padding:7px 11px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}


.hero{padding:40px 0 22px;display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:26px;gap:14px}}
.hero h1{font-size:clamp(34px,6.5vw,64px);line-height:.98;margin:0}
.hero h1 em{color:var(--acc)}
.hero p{color:var(--mute);margin:0;font-size:16px}
.howto{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13.5px;color:var(--mute)}
.howto b{color:var(--ink)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar input[type=search]{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;width:190px;outline:0}
.bar select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 10px}
.tog{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--mute);white-space:nowrap}
.tog input{accent-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px 18px;padding-bottom:50px}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:16px 10px}}
.card{display:flex;flex-direction:column;gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:#E8E1D3}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .ph img{transform:scale(1.03)}
.noimg{width:100%;height:100%;display:grid;place-items:center;font-size:52px}
.st{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;background:#fff}
.st.res{background:var(--warn);color:#fff}.st.sold{background:var(--ink);color:#fff}
.card.sold .ph{opacity:.55}
.cb{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ttl{font-weight:600;line-height:1.3}
.price{font-size:18px;white-space:nowrap}
.meta{color:var(--mute);font-size:13px}
.empty{text-align:center;padding:56px 16px;color:var(--mute);border:1px dashed #D3CAB8;border-radius:var(--r);grid-column:1/-1}
.empty b{display:block;color:var(--ink);font-size:18px;font-family:Fraunces,serif;margin-bottom:4px}
.skel{aspect-ratio:1;border-radius:var(--r);background:linear-gradient(90deg,#E6DFD1,#EFE9DD,#E6DFD1);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}


.back{display:inline-block;color:var(--mute);font-weight:600;margin:20px 0 14px}
.det{display:grid;grid-template-columns:1.25fr 1fr;gap:30px;padding-bottom:56px}
@media(max-width:820px){.det{grid-template-columns:1fr;gap:18px}}
.main{aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:#E8E1D3}
.main img{width:100%;height:100%;object-fit:contain;background:#1b1a18}
.thumbs{display:flex;gap:8px;margin-top:10px}
.thumbs button{width:68px;height:68px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer}
.thumbs button.on{border-color:var(--acc)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.det h1{font-size:32px;line-height:1.1;margin:0 0 8px}
.det .price{font-size:30px;color:var(--acc)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.tag{background:var(--acc2);color:var(--acc);border-radius:6px;padding:3px 9px;font-size:13px;font-weight:600}
.desc{white-space:pre-wrap;margin:0 0 20px;color:#38342D}
.sticky{position:sticky;top:16px}
.small{font-size:13px;color:var(--mute);margin-top:8px;text-align:center}


.pt{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:26px 0 16px}
.pt h2{margin:0;font-size:30px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:10px 14px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--ink);border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:Fraunces,serif;font-size:26px}
.stat span{color:var(--mute);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px;padding-bottom:50px}
.li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.li .th{width:64px;height:64px;border-radius:10px;overflow:hidden;flex:none;background:#E8E1D3}
.li .th img{width:100%;height:100%;object-fit:cover}.li .th .noimg{font-size:28px}
.li .inf{flex:1;min-width:0}
.li .inf b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.li select{border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;font-size:13.5px}
@media(max-width:600px){.li{flex-wrap:wrap}.li .acts{width:100%;justify-content:flex-start}}
form.f{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:50px}
@media(max-width:600px){form.f{grid-template-columns:1fr;padding:16px}}
.fl{display:flex;flex-direction:column;gap:5px}.fl.full{grid-column:1/-1}
.fl label{font-weight:600;font-size:13.5px}.fl small{color:var(--mute);font-size:12.5px}
.fl input,.fl select,.fl textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:0;width:100%}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.fl textarea{min-height:110px;resize:vertical}
.pics{display:flex;gap:10px;flex-wrap:wrap}
.pic{position:relative;width:90px;height:90px;border-radius:10px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.pic button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.addpic{width:90px;height:90px;border-radius:10px;border:2px dashed #CFC5B2;background:transparent;color:var(--mute);cursor:pointer;font-weight:600;font-size:13px}
.err{color:#A42A20;font-size:13px;font-weight:600}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%)}
.mbg{position:fixed;inset:0;background:rgba(22,21,19,.45);display:grid;place-items:center;z-index:60;padding:16px}
.mbg[hidden]{display:none}
.mdl{background:var(--card);border-radius:16px;padding:22px;max-width:380px;width:100%}
.mdl p{margin:0 0 18px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap}
footer{color:var(--mute);font-size:13px;padding:22px 0 34px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="banner"></div>
<header><div class="wrap hbar"><a class="logo" href="#vitrin" id="logo">Elden <span>Ellere</span></a><nav class="hnav"><a href="#vitrin" data-n="h">Vitrin</a><a href="#hakkimda" data-n="ab">Hakkımda</a></nav><span id="hbtn"></span></div></header>
<main id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>
<div id="toast" role="status" aria-live="polite"></div>
<div class="mbg" id="modal" hidden><div class="mdl"><p id="mtext"></p><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="mno">Vazgeç</button><button class="btn acc" id="myes">Evet</button></div></div></div>
<script type="module">
import {firebaseConfig,OWNER_EMAIL} from "./config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,onSnapshot,query,orderBy,limit,setDoc,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const CATS=[["elektronik","Elektronik","📱"],["ev","Ev & Mobilya","🛋️"],["giyim","Giyim","👕"],["kitap","Kitap & Hobi","📚"],["spor","Spor","🚲"],["diger","Diğer","📦"]];
const CATMAP=Object.fromEntries(CATS.map(c=>[c[0],c]));
const CONDS=["Sıfır gibi","Az kullanılmış","İyi durumda","Yıpranmış"];
const STAT={active:"Satışta",reserved:"Rezerve",sold:"Satıldı"};
const PH=["#E9D5C6","#D5E2D6","#DDD8EA","#EEE1BF","#D3E1EA","#E4DED2"];
const ABOUT=`Merhaba, burası benim küçük ikinci el köşem.

Evde zamanla bir şeyler birikiyor: bir zamanlar çok sevdiğim ama artık kullanmadığım eşyalar, "bir gün lazım olur" diye dolapta beklettiklerim… Onları bir köşede tozlandırmak yerine gerçekten işine yarayacak birine ulaştırmak istedim. Elden Ellere böyle doğdu.

Burada gördüğün her şey benim kendi eşyam. Mağaza değilim, aracı da yok. Her ürünün nasıl kullanıldığını bizzat biliyorum. Kusuru varsa açıklamada yazarım, merak ettiğin bir şey olursa dürüstçe cevaplarım. Gerekirse ekstra fotoğraf da çekerim.

Beğendiğin bir ürün olursa sayfasındaki WhatsApp butonuna dokunman yeterli, mesajın hazır gelir. Pazarlık payı varsa ürünün üzerinde yazar. Teslimatı elden ya da kargoyla yapabiliriz.

Eşyalar ikinci el olabilir ama güven her zaman birinci el olmalı.`;
const DEF={name:"Elden Ellere",tagline:"Kullanmadığım eşyaları uygun fiyata satıyorum. Beğendiğin bir şey olursa WhatsApp'tan yaz.",wa:"",city:"",about:ABOUT};
function mark(bg,fg,dot){return `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="${bg}"/>
<path d="M18 35a14 14 0 0 1 24.5-11.8" fill="none" stroke="${fg}" stroke-width="5.5" stroke-linecap="round"/>
<path d="M46 29a14 14 0 0 1-24.5 11.8" fill="none" stroke="${fg}" stroke-width="5.5" stroke-linecap="round"/>
<path d="M37.5 17.5l6.8 4.6-5.6 6" fill="none" stroke="${fg}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M26.5 46.5l-6.8-4.6 5.6-6" fill="none" stroke="${fg}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="32" cy="32" r="4.2" fill="${dot}"/></svg>`}
const LOGO=mark("#1F4D36","#F3EFE6","#E9A23B");

const S={owner:false,user:null,items:[],set:{...DEF},ready:false,f:{q:"",cat:"",sort:"new",sold:false},editing:null,keep:false,draft:[],gi:0,note:""};
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0}),tl=n=>fmt.format(Number(n)||0);
const low=s=>String(s||"").toLocaleLowerCase("tr");
const newId=()=>"u"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const safeImg=u=>typeof u==="string"&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u)?u:null;
function ph(l,big){const c=CATMAP[l.cat]||CATMAP.diger;return `<div class="noimg" style="background:${PH[CATS.indexOf(c)%PH.length]}${big?";font-size:110px":""}">${c[2]}</div>`}
const img=(l,big)=>{const u=safeImg((l.images||[])[0]);return u?`<img src="${u}" alt="" loading="lazy">`:ph(l,big)};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2500)}
function ask(m,y){return new Promise(r=>{$("#mtext").textContent=m;$("#myes").textContent=y||"Evet";const md=$("#modal");md.hidden=false;const d=v=>{md.hidden=true;r(v)};$("#myes").onclick=()=>d(true);$("#mno").onclick=()=>d(false)})}
function waLink(l){const n=String(S.set.wa||"").replace(/\D/g,"").replace(/^0/,"90");if(n.length<10)return null;
 const msg=l?`Merhaba, "${l.title}" (${tl(l.price)}) hâlâ satılık mı?`:"Merhaba, sitendeki ürünler hakkında yazıyorum.";
 return "https://wa.me/"+n+"?text="+encodeURIComponent(msg)}


const configured=firebaseConfig&&firebaseConfig.apiKey&&!String(firebaseConfig.apiKey).includes("BURAYA")&&OWNER_EMAIL&&!OWNER_EMAIL.includes("BURAYA");
let fs=null,auth=null;
const API={
 save:l=>setDoc(doc(fs,"listings",l.id),l),
 patch:(id,p)=>updateDoc(doc(fs,"listings",id),p),
 del:id=>deleteDoc(doc(fs,"listings",id)),
 settings:s=>setDoc(doc(fs,"site","settings"),s)
};
function werr(e){const c=e&&e.code||"";
 if(c.includes("permission-denied"))toast("Yetki yok: bu hesap yönetici değil ya da kurallar yüklenmemiş.");
 else if(c.includes("invalid-argument")||c.includes("resource-exhausted"))toast("Kayıt çok büyük, fotoğraf sayısını azalt.");
 else toast("Kaydedilemedi, internetini kontrol edip tekrar dene.")}
function init(){
 render();
 if(!configured){$("#banner").innerHTML='<div class="banner">Kurulum eksik: config.js dosyasındaki Firebase bilgilerini ve e-postanı doldur.</div>';S.ready=true;render();return}
 const app_=initializeApp(firebaseConfig);fs=getFirestore(app_);auth=getAuth(app_);
 onAuthStateChanged(auth,u=>{S.user=u;S.owner=!!(u&&u.emailVerified&&low(u.email)===low(OWNER_EMAIL));render()});
 const lt=setTimeout(()=>{if(!S.ready){S.note="Ürünlere şu an ulaşılamıyor, bağlantı gelince yüklenecek.";soft()}},10000);
 onSnapshot(query(collection(fs,"listings"),orderBy("createdAt","desc"),limit(500)),s=>{S.items=s.docs.map(x=>({...x.data(),id:x.id}));S.ready=true;S.note="";clearTimeout(lt);soft()},
  e=>{clearTimeout(lt);S.ready=true;S.note="Ürünler yüklenemedi ("+esc(e.code||"hata")+").";soft()});
 onSnapshot(doc(fs,"site","settings"),s=>{S.set={...DEF,...(s.exists()?s.data():{})};soft()},()=>{});
}
async function login(){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){if(!String(e.code).includes("popup-closed"))toast("Giriş yapılamadı: "+(e.code||"hata"))}}


function route(){const h=(location.hash||"#vitrin").slice(1);
 if(h.startsWith("urun-"))return{v:"d",id:h.slice(5)};
 if(h==="hakkimda")return{v:"ab"};
 if(h==="yonetim")return{v:"a",t:"urunler"};
 if(h.startsWith("yonetim-"))return{v:"a",t:h.slice(8)};
 return{v:"h"}}
addEventListener("hashchange",()=>{const r=route();if(r.v==="a"&&r.t==="ekle"&&!S.keep){S.editing=null;S.draft=[]}S.keep=false;S.gi=0;render();scrollTo(0,0)});
function soft(){const r=route();if(S._form)return chrome();if(r.v==="h"&&S._home){chrome();return grid()}render()}
function chrome(){document.title=S.set.name+" — İkinci El";
 const n=esc(S.set.name),i=n.lastIndexOf(" ");$("#logo").innerHTML=LOGO+"<b>"+(i>0?n.slice(0,i)+" <span>"+n.slice(i+1)+"</span>":n)+"</b>";
 const r=route(),wa=waLink();
 document.querySelectorAll("[data-n]").forEach(a=>a.classList.toggle("on",a.dataset.n===r.v));
 $("#hbtn").innerHTML=(S.owner?`<a class="btn sm ${r.v==="a"?"ghost":""}" href="${r.v==="a"?"#vitrin":"#yonetim"}">${r.v==="a"?"Vitrini gör":"⚙ Yönetim"}</a> `:"")+(wa&&r.v!=="a"?`<a class="btn wa sm" style="width:auto;font-size:13.5px;padding:7px 12px" href="${wa}" target="_blank" rel="noopener">WhatsApp</a>`:"");
 $("#foot").innerHTML=`${n}${S.set.city?" · "+esc(S.set.city):""} · Ürünler elden ya da kargoyla teslim edilir.${S.owner?"":` <a href="#yonetim" style="opacity:.6;margin-left:6px">Yönetici girişi</a>`}`}
function render(){S._form=false;S._home=false;chrome();const r=route();
 if(r.v==="d")return detail(r.id);if(r.v==="a")return admin(r.t);if(r.v==="ab")return about();home()}


function about(){app.innerHTML=`<div class="wrap"><section class="ab"><div class="abmark">${mark("transparent","#F3EFE6","#E9A23B")}<small>ELDEN · ELLERE</small></div>
 <div><h1>Eşyaların <em>ikinci</em><br>hikâyesi burada başlar.</h1><div class="abtxt">${esc(S.set.about||ABOUT)}</div>
 <div class="row" style="margin-top:22px"><a class="btn acc" href="#vitrin">Vitrine göz at →</a>${waLink()?`<a class="btn wa" style="width:auto;font-size:15px;padding:10px 16px" href="${waLink()}" target="_blank" rel="noopener">💬 Bana yaz</a>`:""}</div></div></section>
 <div class="prom"><div>🔍<b>Dürüst açıklama</b><span>Kusur varsa saklamam, fotoğrafta ve yazıda görürsün.</span></div>
 <div>⚡<b>Hızlı dönüş</b><span>WhatsApp mesajlarına genelde aynı gün dönerim.</span></div>
 <div>🤝<b>Elden ya da kargo</b><span>${S.set.city?esc(S.set.city)+" içindeysen elden, değilsen kargoyla.":"Yakınsan elden, uzaksan kargoyla."}</span></div></div></div>`}


function home(){const f=S.f;
 app.innerHTML=`<div class="wrap"><section class="hero"><h1>Bir dolu eşya,<br><em>yeni sahibini</em> arıyor.</h1><div><p>${esc(S.set.tagline)}</p>
 <div class="howto"><span><b>1.</b> Ürünü seç</span><span><b>2.</b> WhatsApp'tan yaz</span><span><b>3.</b> Elden ya da kargo</span></div></div></section>
 <div class="bar"><div class="chips" id="chips"><button class="chip ${!f.cat?"on":""}" data-c="">Tümü</button>${CATS.map(c=>`<button class="chip ${f.cat===c[0]?"on":""}" data-c="${c[0]}">${c[2]} ${c[1]}</button>`).join("")}</div>
 <input type="search" id="q" placeholder="Ara…" value="${esc(f.q)}" aria-label="Ara">
 <select id="so" aria-label="Sırala"><option value="new">En yeni</option><option value="asc" ${f.sort==="asc"?"selected":""}>Ucuzdan pahalıya</option><option value="desc" ${f.sort==="desc"?"selected":""}>Pahalıdan ucuza</option></select>
 <label class="tog"><input type="checkbox" id="sd" ${f.sold?"checked":""}> Satılanlar</label></div>
 <div id="nt"></div><div class="grid" id="grid"></div>
 <div class="teaser">${mark("#F3EFE6","#1F4D36","#E9A23B")}<div><p>Mağaza değil, aracı yok. Hepsi benim kendi eşyam.</p><a href="#hakkimda">Hakkımda daha fazlası →</a></div></div></div>`;
 S._home=true;
 $("#chips").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;f.cat=b.dataset.c;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));grid()};
 $("#q").oninput=e=>{f.q=e.target.value;grid()};$("#so").onchange=e=>{f.sort=e.target.value;grid()};$("#sd").onchange=e=>{f.sold=e.target.checked;grid()};
 grid()}
function list(){const f=S.f,q=low(f.q).trim();let a=S.items.filter(l=>f.sold||l.status!=="sold");
 if(f.cat)a=a.filter(l=>l.cat===f.cat);if(q)a=a.filter(l=>low(l.title+" "+l.desc).includes(q));
 const rank=l=>l.status==="sold"?1:0;
 a.sort((x,y)=>rank(x)-rank(y)||(f.sort==="asc"?x.price-y.price:f.sort==="desc"?y.price-x.price:(y.createdAt||0)-(x.createdAt||0)));return a}
function card(l){return `<a class="card ${l.status==="sold"?"sold":""}" href="#urun-${esc(l.id)}"><div class="ph">${img(l)}${l.status!=="active"&&STAT[l.status]?`<span class="st ${l.status==="sold"?"sold":"res"}">${STAT[l.status]}</span>`:""}</div>
 <div class="cb"><span class="ttl">${esc(l.title)}</span><span class="price">${tl(l.price)}</span></div><span class="meta">${esc(l.cond||"")}${l.nego?" · Pazarlık olur":""}</span></a>`}
function grid(){const g=$("#grid");if(!g)return;$("#nt").innerHTML=S.note?`<div class="note">${S.note}</div>`:"";
 if(!S.ready){g.innerHTML=Array(6).fill('<div class="skel"></div>').join("");return}
 const a=list();
 g.innerHTML=a.length?a.map(card).join(""):`<div class="empty"><b>${S.items.length?"Bu aramaya uygun ürün yok":"Vitrin henüz boş"}</b>${S.items.length?"Başka bir kategoriye bak.":S.owner?`<div class="row" style="justify-content:center;margin-top:12px"><a class="btn acc" href="#yonetim-ekle">+ İlk ürünü ekle</a></div>`:"Yakında yeni ürünler eklenecek."}</div>`}


function detail(id){const l=S.items.find(x=>x.id===id);
 if(!l){app.innerHTML=`<div class="wrap"><a class="back" href="#vitrin">← Vitrine dön</a>${S.ready?'<div class="empty"><b>Ürün bulunamadı</b>Kaldırılmış olabilir.</div>':'<div class="skel" style="aspect-ratio:16/7"></div>'}</div>`;return}
 const ims=(l.images||[]).map(safeImg).filter(Boolean),gi=Math.min(S.gi,Math.max(0,ims.length-1)),c=CATMAP[l.cat]||CATMAP.diger,wa=waLink(l);
 app.innerHTML=`<div class="wrap"><a class="back" href="#vitrin">← Vitrine dön</a><div class="det">
 <div><div class="main">${ims.length?`<img src="${ims[gi]}" alt="">`:ph(l,true)}</div>${ims.length>1?`<div class="thumbs">${ims.map((u,i)=>`<button class="${i===gi?"on":""}" data-gi="${i}"><img src="${u}" alt=""></button>`).join("")}</div>`:""}</div>
 <div><div class="sticky"><h1>${esc(l.title)}</h1><div class="price">${tl(l.price)}</div>
 <div class="tags"><span class="tag">${STAT[l.status]||"Satışta"}</span><span class="tag">${c[2]} ${c[1]}</span><span class="tag">${esc(l.cond||"")}</span>${l.nego?'<span class="tag">Pazarlık olur</span>':""}</div>
 ${l.desc?`<p class="desc">${esc(l.desc)}</p>`:""}
 ${l.status==="sold"?'<div class="note">Bu ürün satıldı.</div>':wa?`<a class="btn wa" href="${wa}" target="_blank" rel="noopener">💬 WhatsApp'tan sor</a><div class="small">${l.status==="reserved"?"Şu an rezerve, sıraya girmek için yazabilirsin. ":""}Mesaj hazır gelir, sadece gönder.</div>`:'<div class="note">İletişim bilgisi yakında eklenecek.</div>'}
 ${S.owner?`<div class="row" style="margin-top:16px"><button class="btn ghost sm" data-act="edit" data-id="${esc(l.id)}">Düzenle</button></div>`:""}
 </div></div></div></div>`;
 app.querySelectorAll("[data-gi]").forEach(b=>b.onclick=()=>{S.gi=+b.dataset.gi;detail(id)})}


const TABS=[["urunler","Ürünlerim"],["ekle","Ürün Ekle"],["ayarlar","Site Ayarları"]];
function admin(t){
 if(!configured){app.innerHTML='<div class="wrap"><div class="empty" style="margin:30px 0"><b>Kurulum eksik</b>config.js dosyasını doldur.</div></div>';return}
 if(!S.user){app.innerHTML=`<div class="wrap"><div class="empty" style="margin:30px 0">${LOGO.replace("<svg ",'<svg style="width:56px;height:56px;margin-bottom:10px" ')}<b>Yönetici girişi</b>Sadece site sahibi giriş yapabilir.<div class="row" style="justify-content:center;margin-top:14px"><button class="btn acc" data-act="login">Google ile giriş yap</button></div></div></div>`;return}
 if(!S.owner){app.innerHTML=`<div class="wrap"><div class="empty" style="margin:30px 0"><b>Bu hesap yönetici değil</b>${esc(S.user.email||"")} ile giriş yaptın.<div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" data-act="logout">Çıkış yap</button><a class="btn acc" href="#vitrin">Vitrine dön</a></div></div></div>`;return}
 if(!TABS.some(x=>x[0]===t))t="urunler";
 app.innerHTML=`<div class="wrap"><div class="pt"><h2>Yönetim</h2><div class="row"><button class="btn ghost sm" data-act="logout">Çıkış</button><a class="btn acc sm" href="#yonetim-ekle">+ Ürün ekle</a></div></div>
 <nav class="tabs">${TABS.map(x=>`<a href="#yonetim${x[0]==="urunler"?"":"-"+x[0]}" class="${x[0]===t?"on":""}">${x[0]==="ekle"&&S.editing?"Ürünü Düzenle":x[1]}</a>`).join("")}</nav><div id="ab"></div></div>`;
 const b=$("#ab");
 if(!waLink()&&t!=="ayarlar")b.insertAdjacentHTML("beforebegin",`<div class="note">Alıcılar sana ulaşamaz: <a href="#yonetim-ayarlar" style="font-weight:700;color:var(--acc)">WhatsApp numaranı ekle</a>.</div>`);
 if(t==="urunler")return aList(b);if(t==="ekle")return aForm(b);aSet(b)}
function aList(b){const a=S.items,act=a.filter(l=>l.status!=="sold"),sold=a.filter(l=>l.status==="sold"),sum=x=>x.reduce((s,l)=>s+(Number(l.price)||0),0);
 b.innerHTML=`<div class="stats"><div class="stat"><b>${act.length}</b><span>Satışta / rezerve</span></div><div class="stat"><b>${sold.length}</b><span>Satıldı</span></div><div class="stat"><b>${tl(sum(sold))}</b><span>Kazanılan</span></div><div class="stat"><b>${tl(sum(act))}</b><span>Vitrindeki değer</span></div></div>
 <div class="list">${a.length?a.map(l=>`<div class="li"><a class="th" href="#urun-${esc(l.id)}">${img(l)}</a><div class="inf"><b>${esc(l.title)}</b><span class="meta">${tl(l.price)}</span></div>
 <div class="acts"><select data-st="${esc(l.id)}" aria-label="Durum">${Object.entries(STAT).map(([k,v])=>`<option value="${k}" ${(l.status||"active")===k?"selected":""}>${v}</option>`).join("")}</select>
 <button class="btn ghost sm" data-act="edit" data-id="${esc(l.id)}">Düzenle</button><button class="btn danger sm" data-act="del" data-id="${esc(l.id)}">Sil</button></div></div>`).join(""):'<div class="empty"><b>Henüz ürün yok</b>Sağ üstten ilk ürününü ekle.</div>'}</div>`;
 b.querySelectorAll("[data-st]").forEach(s=>s.onchange=async()=>{try{await API.patch(s.dataset.st,{status:s.value});toast("Durum: "+STAT[s.value])}catch(e){werr(e)}})}
function aForm(b){const l=S.editing?S.items.find(x=>x.id===S.editing):null;if(!l)S.editing=null;
 const v=l||{title:"",price:"",cat:"",cond:"",desc:"",nego:false};
 b.innerHTML=`<form class="f" id="lf" novalidate>
 <div class="fl full"><label>Fotoğraflar <small>(en fazla 4, ilki kapak olur)</small></label><div class="pics" id="pics"></div><input type="file" id="file" accept="image/*" multiple hidden></div>
 <div class="fl full"><label for="t">Ürün adı</label><input id="t" maxlength="80" placeholder="Örn. Logitech kablosuz mouse" value="${esc(v.title)}"></div>
 <div class="fl"><label for="p">Fiyat (₺)</label><input id="p" type="number" inputmode="numeric" min="0" value="${esc(v.price)}"></div>
 <div class="fl"><label for="c">Kategori</label><select id="c"><option value="">Seç…</option>${CATS.map(c=>`<option value="${c[0]}" ${v.cat===c[0]?"selected":""}>${c[2]} ${c[1]}</option>`).join("")}</select></div>
 <div class="fl"><label for="d">Durumu</label><select id="d"><option value="">Seç…</option>${CONDS.map(c=>`<option ${v.cond===c?"selected":""}>${c}</option>`).join("")}</select></div>
 <div class="fl" style="justify-content:flex-end"><label class="tog" style="font-size:14px;color:var(--ink)"><input type="checkbox" id="ng" ${v.nego?"checked":""}> Pazarlık payı var</label></div>
 <div class="fl full"><label for="ds">Açıklama</label><textarea id="ds" maxlength="2000" placeholder="Ne kadar kullanıldı, kusuru var mı, kutusu var mı…">${esc(v.desc)}</textarea></div>
 <div class="fl full"><span class="err" id="fe"></span><div class="row">${l?'<button type="button" class="btn ghost" id="cn">Vazgeç</button>':""}<button class="btn acc" type="submit">${l?"Kaydet":"Vitrine ekle"}</button></div></div></form>`;
 S._form=true;pics();
 $("#file").onchange=async e=>{for(const f of [...e.target.files].slice(0,4-S.draft.length)){try{S.draft.push(await shrink(f))}catch(x){toast("Fotoğraf okunamadı.")}}e.target.value="";pics()};
 if($("#cn"))$("#cn").onclick=()=>{S.editing=null;S.draft=[];location.hash="#yonetim"};
 $("#lf").onsubmit=async e=>{e.preventDefault();
  const val={title:$("#t").value.trim(),price:Math.round(Number($("#p").value)),cat:$("#c").value,cond:$("#d").value,desc:$("#ds").value.trim(),nego:$("#ng").checked};
  const miss=[!val.title&&"ürün adı",($("#p").value===""||!(val.price>=0))&&"fiyat",!val.cat&&"kategori",!val.cond&&"durum"].filter(Boolean);
  if(miss.length){$("#fe").textContent="Eksik: "+miss.join(", ");return}
  const btn=$("#lf button[type=submit]");btn.disabled=true;btn.textContent="Kaydediliyor…";
  const d={...(l||{}),...val,images:S.draft.slice(0,4),id:l?l.id:newId(),createdAt:l?l.createdAt:Date.now(),updatedAt:Date.now(),status:l?(l.status||"active"):"active"};
  try{await API.save(d);toast(l?"Güncellendi ✓":"Vitrine eklendi 🎉");S.editing=null;S.draft=[];S._form=false;location.hash="#urun-"+d.id}
  catch(x){btn.disabled=false;btn.textContent=l?"Kaydet":"Vitrine ekle";werr(x)}}}
function pics(){const w=$("#pics");if(!w)return;
 w.innerHTML=S.draft.map((u,i)=>`<div class="pic"><img src="${safeImg(u)||""}" alt=""><button type="button" data-rm="${i}" aria-label="Kaldır">✕</button></div>`).join("")+(S.draft.length<4?'<button type="button" class="addpic" id="ap">📷<br>Ekle</button>':"");
 w.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{S.draft.splice(+x.dataset.rm,1);pics()});if($("#ap"))$("#ap").onclick=()=>$("#file").click()}

function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{let max=1200,q=.78,out="";for(let i=0;i<8;i++){const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<150000)break;if(q>.5)q-=.1;else max=Math.round(max*.8)}
  URL.revokeObjectURL(u);res(out)};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
function aSet(b){const s=S.set;
 b.innerHTML=`<form class="f" id="sf" novalidate>
 <div class="fl"><label for="sn">Site adı</label><input id="sn" maxlength="40" value="${esc(s.name)}"></div>
 <div class="fl"><label for="sc">Şehir</label><input id="sc" maxlength="40" placeholder="Örn. Ankara" value="${esc(s.city)}"></div>
 <div class="fl full"><label for="sw">WhatsApp numarası</label><input id="sw" type="tel" maxlength="20" placeholder="05xx xxx xx xx" value="${esc(s.wa)}"><small>Ziyaretçiler "WhatsApp'tan sor" butonuyla bu numaraya hazır mesaj gönderir. Numara sayfada görünür.</small></div>
 <div class="fl full"><label for="st">Kısa tanıtım</label><textarea id="st" maxlength="300">${esc(s.tagline)}</textarea></div>
 <div class="fl full"><label for="sa">Hakkımda yazısı</label><textarea id="sa" maxlength="3000" style="min-height:240px">${esc(s.about||ABOUT)}</textarea><small>Hakkımda sayfasında görünür.</small></div>
 <div class="fl full"><span class="err" id="se"></span><div class="row"><button class="btn acc" type="submit">Kaydet</button></div></div></form>`;
 S._form=true;
 $("#sf").onsubmit=async e=>{e.preventDefault();const n={name:$("#sn").value.trim()||DEF.name,city:$("#sc").value.trim(),wa:$("#sw").value.trim(),tagline:$("#st").value.trim()||DEF.tagline,about:$("#sa").value.trim()||ABOUT};
  if(n.wa&&n.wa.replace(/\D/g,"").length<10){$("#se").textContent="Numara eksik görünüyor.";return}
  try{await API.settings(n);S.set=n;toast("Ayarlar kaydedildi ✓");S._form=false;render()}catch(x){werr(x)}}}

document.addEventListener("click",async e=>{const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
 if(act==="login"){e.preventDefault();return login()}
 if(act==="logout"){e.preventDefault();await signOut(auth);location.hash="#vitrin";return}
 if(!S.owner)return;e.preventDefault();
 const id=a.dataset.id,l=S.items.find(x=>x.id===id);if(!l)return;
 if(act==="edit"){S.editing=id;S.draft=(l.images||[]).filter(safeImg);if(location.hash==="#yonetim-ekle")render();else{S.keep=true;location.hash="#yonetim-ekle"}}
 if(act==="del"){if(!await ask(`“${l.title}” silinsin mi? Geri alınamaz.`,"Sil"))return;try{await API.del(id);toast("Silindi")}catch(x){werr(x)}}});
init();
</script>
</body>
</html>
